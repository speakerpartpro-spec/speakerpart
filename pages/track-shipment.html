<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  
  <link rel="icon" href="/assets/icon.png">
  <link rel="stylesheet" href="/styles/globals.css?v=spp20">

  <title>Track Your Shipment | SPEAKERPARTPRO</title>
  <meta name="description" content="Track your international wholesale speaker parts order dispatched via DHL Express, FedEx Priority, or Ocean Freight from SPEAKERPARTPRO.">
  <link rel="canonical" href="https://speakerpartpro.vercel.app/track-shipment.html">
  
  <!-- Google Fonts Preconnect & Async Load -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Rajdhani:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://speakerpartpro.vercel.app/track-shipment.html">
  <meta property="og:title" content="Track Your Shipment | SPEAKERPARTPRO">
  <meta property="og:description" content="Track your international wholesale speaker parts order dispatched via DHL Express, FedEx Priority, or Ocean Freight from SPEAKERPARTPRO.">
  <meta property="og:image" content="https://speakerpartpro.vercel.app/assets/icon.png">
  <meta property="og:site_name" content="SPEAKERPARTPRO">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://speakerpartpro.vercel.app/track-shipment.html">
  <meta name="twitter:title" content="Track Your Shipment | SPEAKERPARTPRO">
  <meta name="twitter:description" content="Track your international wholesale speaker parts order dispatched via DHL Express, FedEx Priority, or Ocean Freight from SPEAKERPARTPRO.">
  <meta name="twitter:image" content="https://speakerpartpro.vercel.app/assets/icon.png">
  

</head>
<body>

  <header class="site-header"></header>

  <main style="padding-top: 4.25rem; padding-bottom: 5rem; flex: 1;">
    <div class="container" style="max-width: 900px;">
      
      <!-- Page Header -->
      <div style="border-bottom: 1px solid var(--border); padding-bottom: 2rem; margin-bottom: 3rem; text-align: center;">
        <span style="font-family: var(--font-display); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); display: block; margin-bottom: 0.5rem;">
          SPEAKERPARTPRO LOGISTICS DESK
        </span>
        <h1 style="font-family: var(--font-display); font-size: 38px; font-weight: 900; text-transform: uppercase; color: var(--text-primary); margin-bottom: 1rem;">
          Track B2B Wholesale Shipment
        </h1>
        <p style="font-size: 14px; color: var(--text-secondary); max-width: 600px; margin: 0 auto; line-height: 1.6;">
          Enter your Airway Bill (AWB) number or Commercial Invoice reference number to monitor transit progress from Jaipur to your facility.
        </p>
      </div>

      <!-- Tracking Search Box -->
      <div style="background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 2.5rem; margin-bottom: 3rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
        <form id="trackingForm" style="display: flex; gap: 1rem; flex-wrap: wrap;">
          <div style="flex: 1; min-width: 260px;">
            <label class="form-label">Tracking Number / AWB</label>
            <input type="text" id="trackInput" class="form-control" placeholder="e.g. DHL-849201928 or SPP-2026-914" required>
          </div>
          <div style="width: 180px;">
            <label class="form-label">Carrier</label>
            <select id="carrierSelect" class="form-control">
              <option value="DHL Express">DHL Express</option>
              <option value="FedEx Priority">FedEx Priority</option>
              <option value="Ocean Freight">Ocean Freight (FCL/LCL)</option>
            </select>
          </div>
          <div style="align-self: flex-end;">
            <button type="submit" class="btn-accent" style="padding: 0.75rem 1.75rem; height: 44px;">
              Track Shipment
            </button>
          </div>
        </form>

        <!-- Sample Track Codes -->
        <div style="margin-top: 1.25rem; font-size: 12px; color: #777;">
          <span>Sample test numbers:</span>
          <button type="button" class="btn-outline" style="padding: 0.2rem 0.6rem; font-size: 11px; margin-left: 0.5rem;" onclick="document.getElementById('trackInput').value='DHL-849201928'; document.getElementById('trackingForm').dispatchEvent(new Event('submit'))">
            DHL-849201928 (In Transit - USA)
          </button>
          <button type="button" class="btn-outline" style="padding: 0.2rem 0.6rem; font-size: 11px; margin-left: 0.5rem;" onclick="document.getElementById('trackInput').value='SPP-2026-914'; document.getElementById('trackingForm').dispatchEvent(new Event('submit'))">
            SPP-2026-914 (Customs Cleared)
          </button>
        </div>
      </div>

      <!-- Tracking Results Timeline -->
      <div id="trackingResult" style="display: none; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 2.5rem;">
        <!-- Injected via JS -->
      </div>

    </div>
  </main>

  <footer class="site-footer"></footer>
  <script src="/scripts/app.js?v=spp20"></script>
  <script>
    document.getElementById('trackingForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const code = document.getElementById('trackInput').value.trim();
      const carrier = document.getElementById('carrierSelect').value;
      const res = document.getElementById('trackingResult');

      res.style.display = 'block';
      res.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
          <div>
            <span style="font-family: var(--font-display); font-size: 12px; font-weight: 800; text-transform: uppercase; color: var(--accent); letter-spacing: 0.05em;">
              STATUS: IN TRANSIT VIA ${carrier.toUpperCase()}
            </span>
            <h3 style="font-family: var(--font-display); font-size: 24px; font-weight: 800; color: var(--text-primary); margin-top: 0.25rem;">
              Shipment #${code}
            </h3>
          </div>
          <div style="text-align: right;">
            <div style="font-size: 11px; color: #777;">Estimated Delivery</div>
            <div style="font-family: var(--font-mono); font-size: 18px; font-weight: 700; color: var(--text-primary);">Within 2-3 Business Days</div>
          </div>
        </div>

        <!-- Milestones Timeline -->
        <div style="display: flex; flex-direction: column; gap: 1.75rem; border-left: 2px solid var(--accent); margin-left: 1rem; padding-left: 1.5rem;">
          <div style="position: relative;">
            <span style="position: absolute; left: -2.05rem; top: 0; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent-glow);"></span>
            <div style="font-family: var(--font-display); font-size: 12px; color: var(--accent); font-weight: 700; text-transform: uppercase;">CURRENT LOCATION • TRANSIT DESTINATION HUB</div>
            <h4 style="font-size: 14px; font-weight: 700; color: var(--text-primary); margin-top: 0.2rem;">Processed through International Clearance Hub</h4>
            <p style="font-size: 12px; color: var(--text-tertiary); margin-top: 0.25rem;">Documents verified under HS Code 8518.90.00. Ready for final mile courier dispatch.</p>
          </div>

          <div style="position: relative;">
            <span style="position: absolute; left: -2.05rem; top: 0; width: 14px; height: 14px; border-radius: 50%; background: #444;"></span>
            <div style="font-family: var(--font-display); font-size: 12px; color: var(--text-tertiary); text-transform: uppercase;">INTERNATIONAL AIRPORT • NEW DELHI (DEL)</div>
            <h4 style="font-size: 14px; font-weight: 700; color: var(--text-secondary); margin-top: 0.2rem;">Departed Flight on Air Courier Service</h4>
            <p style="font-size: 12px; color: var(--text-tertiary); margin-top: 0.25rem;">Airway Bill manifested and loaded onto international express freighter.</p>
          </div>

          <div style="position: relative;">
            <span style="position: absolute; left: -2.05rem; top: 0; width: 14px; height: 14px; border-radius: 50%; background: #444;"></span>
            <div style="font-family: var(--font-display); font-size: 12px; color: var(--text-tertiary); text-transform: uppercase;">EXPORT FACILITY • JAIPUR, INDIA</div>
            <h4 style="font-size: 14px; font-weight: 700; color: var(--text-secondary); margin-top: 0.2rem;">Dispatched from SPEAKERPARTPRO Factory Export Department</h4>
            <p style="font-size: 12px; color: var(--text-tertiary); margin-top: 0.25rem;">Multi-point quality verification complete. Packed in moisture-barrier cartons.</p>
          </div>
        </div>
      `;
      res.scrollIntoView({ behavior: 'smooth' });
    });
  </script>
</body>
</html>
