  <script src="/scripts/app.js?v=spp8"></script>
  <script>
    let catProducts = [];
    let currentCategory = null;

    const POPOUT_MAP = {
      'voice-coils': '/assets/voice-coil-popout.png',
      'speaker-cones': '/assets/speaker-cone-popout.png',
      'speaker-surrounds': '/assets/speaker-surround-popout.png',
      'speaker-spiders': '/assets/speaker-spider-popout.png',
      'dust-caps': '/assets/dust-cap-popout.png',
      'diaphragms': '/assets/category-diaphragms-popout.png',
      'lead-wires': '/assets/category-terminals-leadwire-popout.png',
      'speaker-terminals': '/assets/category-terminals-leadwire-popout.png',
      'subwoofers': '/assets/subwoofer-popout.png',
      'speaker-edge-ports': '/assets/collage-surrounds.jpg',
      'custom-recone-kits': '/assets/recone-kit-banner.jpg',
      'custom-repair-kits': '/assets/recone-kit-banner.jpg'
    };

    async function initCategoryPage() {
      const urlParams = new URLSearchParams(window.location.search);
      let slug = urlParams.get('slug');

      if (!slug) {
        const path = window.location.pathname.replace('/', '').replace('.html', '');
        if (path) slug = path;
      }

      if (!slug) slug = 'voice-coils';

      try {
        const [catRes, prodRes] = await Promise.all([
          fetch('/data/categories.json'),
          fetch('/data/products.json')
        ]);

        const categories = await catRes.json();
        const allProducts = await prodRes.json();

        currentCategory = categories.find(c => c.slug === slug) || {
          name: slug.replace(/-/g, ' ').toUpperCase(),
          slug: slug,
          description: 'Factory-direct precision loudspeaker replacement parts and OEM acoustic assemblies.'
        };

        document.title = `${currentCategory.name} | SPEAKERPARTPRO`;
        document.getElementById('catBreadcrumb').textContent = currentCategory.name;
        document.getElementById('catTitle').textContent = currentCategory.name;
        document.getElementById('catDesc').textContent = currentCategory.description || 'Precision loudspeaker components engineered for OEM manufacturers, audio brands, and reconing professionals worldwide.';

        // Dynamic Canonical & Meta Description
        const catCanonicalUrl = `https://speakerpartpro.vercel.app/${currentCategory.slug}`;
        let canonicalEl = document.querySelector('link[rel="canonical"]');
        if (!canonicalEl) {
          canonicalEl = document.createElement('link');
          canonicalEl.rel = 'canonical';
          document.head.appendChild(canonicalEl);
        }
        canonicalEl.href = catCanonicalUrl;

        let metaDescEl = document.querySelector('meta[name="description"]');
        if (!metaDescEl) {
          metaDescEl = document.createElement('meta');
          metaDescEl.name = 'description';
          document.head.appendChild(metaDescEl);
        }
        metaDescEl.content = `Wholesale ${currentCategory.name} from SPEAKERPARTPRO. Factory-direct loudspeaker replacement parts and OEM acoustic assemblies. High durability, export ready.`;

        const popoutImg = POPOUT_MAP[slug] || '/assets/voice-coil-popout.png';
        document.getElementById('catPopoutImg').src = popoutImg;

        catProducts = allProducts.filter(p => p.category_slug === slug);
        document.getElementById('catProdCount').textContent = catProducts.length;

        renderGrid(catProducts);

        document.getElementById('catSearchInput').addEventListener('input', (e) => {
          const q = e.target.value.toLowerCase().trim();
          const filtered = catProducts.filter(p => `${p.name} ${p.short_desc || ''}`.toLowerCase().includes(q));
          document.getElementById('catProdCount').textContent = filtered.length;
          renderGrid(filtered);
        });

      } catch (e) {
        console.error(e);
      }
    }

    function renderGrid(list) {
      const grid = document.getElementById('catProductsGrid');
      if (list.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 4rem; color: var(--text-tertiary);">No models found in this category.</div>';
        return;
      }

      grid.innerHTML = list.map(p => {
        const img = p.featured_image || '/assets/voice-coil-popout.png';
        const price = p.variants && p.variants.price ? window.TSPC.formatPrice(p.variants.price) : 'B2B RFQ';
        const badge = p.seo_meta && p.seo_meta.badge_text ? p.seo_meta.badge_text : (p.is_featured ? 'PRO SPEC' : null);
        const productUrl = `/${p.category_slug || currentCategory.slug}/${p.slug}`;

        return `
          <div class="product-card">
            <a href="${productUrl}">
              <div class="product-img-wrapper">
                ${badge ? `<span class="product-badge">${badge}</span>` : ''}
                <img src="${img}" alt="${p.name}" loading="lazy" onerror="this.src='/assets/voice-coil-popout.png'">
              </div>
            </a>
            <div class="product-details">
              <div>
                <a href="${productUrl}">
                  <h3 style="font-size: 15px; font-weight: 700; color: var(--text-primary); line-height: 1.4; margin-bottom: 0.5rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;" title="${p.name}">
                    ${p.name}
                  </h3>
                </a>
                <div style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 0.75rem;">
                    MOQ: ${p.moq || '500 units'}
                </div>
              </div>
              <div>
                <div style="font-family: var(--font-mono); font-size: 15.5px; font-weight: 700; color: var(--accent); margin-bottom: 0.75rem;" data-usd-price="${p.variants && p.variants.price ? p.variants.price : ''}">
                  ${price}
                </div>
                <div style="display: flex; gap: 0.5rem;">
                  <button onclick="window.TSPC.addToCart({ id: '${p.id}', name: '${p.name.replace(/'/g, "\\'")}', slug: '${p.slug}', featured_image: '${img}', moq: '${p.moq || '500 units'}', variants: { price: ${p.variants && p.variants.price ? p.variants.price : 'null'} } })" class="btn-accent" style="flex: 1; padding: 0.55rem; font-size: 12px;">
                    Add to RFQ
                  </button>
                  <a href="${productUrl}">
                    <button class="btn-outline" style="padding: 0.55rem 0.8rem; font-size: 12px;">
                      Specs
                    </button>
                  </a>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
      if (window.TSPC && window.TSPC.refreshAnimations) {
        window.TSPC.refreshAnimations();
      }
    }

    document.addEventListener('DOMContentLoaded', initCategoryPage);
  </script>
</body>
